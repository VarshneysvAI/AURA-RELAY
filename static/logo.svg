<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="92" y1="40" x2="420" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="176" y1="160" x2="336" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="50" y="20" width="412" height="472" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Glow Shield -->
  <path d="M256 40 L420 100 V240 C420 350 348 428 256 472 C164 428 92 350 92 240 V100 Z"
        fill="#0B1220" stroke="url(#shieldGrad)" stroke-width="18" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Shield Base Background -->
  <path d="M256 40 L420 100 V240 C420 350 348 428 256 472 C164 428 92 350 92 240 V100 Z"
        fill="#0B1220" stroke="url(#shieldGrad)" stroke-width="18" stroke-linejoin="round"/>

  <!-- Voice waveform forming the letter A -->
  <g stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round">
    <line x1="176" y1="272" x2="176" y2="304"/>
    <line x1="200" y1="240" x2="200" y2="336"/>
    <line x1="224" y1="204" x2="224" y2="368"/>
    <line x1="248" y1="156" x2="248" y2="412"/>
    <line x1="272" y1="184" x2="272" y2="388"/>
    <line x1="296" y1="224" x2="296" y2="348"/>
    <line x1="320" y1="260" x2="320" y2="316"/>
  </g>
  <!-- The A crossbar -->
  <line x1="212" y1="304" x2="304" y2="304" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round"/>
</svg>
