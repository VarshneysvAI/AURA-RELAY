<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #6366f1;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #6366f1;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #8b5cf6;
        }
        .error {
            color: #ef4444;
            margin-top: 15px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Secure Portal</h1>
        <p class="subtitle">Please sign in to continue</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            
            <button type="submit" id="submitBtn">Sign in</button>
            
            <p class="error" id="errorMsg"></p>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        
        // Dynamic button text change (simulates DOM instability)
        setTimeout(() => {
            if (submitBtn.textContent === 'Sign in') {
                submitBtn.textContent = 'Continue';
            }
        }, 1200);
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                errorMsg.textContent = 'Please fill in all fields';
                errorMsg.style.display = 'block';
                return;
            }
            
            // Send OTP email via API
            try {
                await fetch('/api/sandbox/send-otp', { method: 'POST' });
                
                // Store credentials temporarily
                sessionStorage.setItem('sandbox_username', username);
                sessionStorage.setItem('sandbox_password', password);
                
                // Redirect to OTP page
                window.location.href = '/sandbox/otp.html';
            } catch (err) {
                errorMsg.textContent = 'Failed to proceed. Please try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
